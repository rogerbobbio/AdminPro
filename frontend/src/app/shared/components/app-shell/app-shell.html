<div class="app-shell">
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed()">
    <button
      type="button"
      class="sidebar-toggle"
      (click)="toggleSidebar()"
      [attr.aria-label]="isSidebarCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
    >
      <i class="bi" [class.bi-chevron-left]="!isSidebarCollapsed()" [class.bi-chevron-right]="isSidebarCollapsed()"></i>
    </button>

    <div class="brand">
      <div class="brand-mark"><i class="bi bi-diagram-3-fill"></i></div>
      <div class="brand-name">AdminPro</div>
    </div>

    <div class="nav-label">Menú</div>
    <a class="nav-item" [class.active]="activeNav() === 'dashboard'" routerLink="/" title="Dashboard">
      <i class="bi bi-grid-fill"></i> <span class="nav-text">Dashboard</span>
    </a>
    <a class="nav-item" [class.active]="activeNav() === 'proyectos'" routerLink="/proyectos" title="Proyectos">
      <i class="bi bi-folder2-open"></i> <span class="nav-text">Proyectos</span>
      <span class="badge">{{ projectService.projects().length }}</span>
    </a>
    <a class="nav-item" [class.active]="activeNav() === 'servicios'" routerLink="/servicios" title="Servicios">
      <i class="bi bi-hdd-network"></i> <span class="nav-text">Servicios</span>
    </a>
    <a class="nav-item" [class.active]="activeNav() === 'buscar'" routerLink="/buscar" title="Buscar">
      <i class="bi bi-search"></i> <span class="nav-text">Buscar</span>
    </a>

    <div class="nav-label">General</div>
    <div class="nav-item" title="Configuración"><i class="bi bi-gear"></i> <span class="nav-text">Configuración</span></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search">
        <i class="bi bi-search"></i>
        <input placeholder="Buscar proyecto, aplicación, servicio..." />
        <kbd>⌘F</kbd>
      </div>
      <div class="topbar-right">
        <div class="icon-btn"><i class="bi bi-envelope"></i></div>
        <div class="icon-btn"><i class="bi bi-bell"></i><span class="dot"></span></div>
        <div class="user">
          <div class="avatar">RB</div>
          <div>
            <div class="user-name">Roger Bobbio</div>
            <div class="user-mail">bobbio68&#64;hotmail.com</div>
          </div>
        </div>
      </div>
    </div>

    <div class="shell-content">
      <ng-content></ng-content>
    </div>
  </main>
</div>
