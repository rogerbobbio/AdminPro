      <span>Total Proyectos</span>
      <a class="stat-arrow" routerLink="/proyectos"><i class="bi bi-arrow-up-right"></i></a>
    </div>
    <div class="stat-num">{{ summary().totalProjects }}</div>
  </div>

  <div class="stat-card">
    <div class="stat-top">
      <span>Aplicaciones</span>
      <a class="stat-arrow" routerLink="/proyectos"><i class="bi bi-arrow-up-right"></i></a>
    </div>
    <div class="stat-num">{{ summary().totalApplications }}</div>
  </div>

  <div class="stat-card">
    <div class="stat-top">
      <span>Ambientes</span>
      <a class="stat-arrow" routerLink="/proyectos"><i class="bi bi-arrow-up-right"></i></a>
    </div>

  </div>

  <div class="stat-card">

      <span>Servicios Vinculados</span>
